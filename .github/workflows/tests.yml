name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install native graphics and video tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglfw3 xvfb xauth ffmpeg
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit, physics and native camera tests
        env:
          FLIGHT_RENDER_TESTS: '1'
          MUJOCO_GL: glfw
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
